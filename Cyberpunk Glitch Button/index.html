<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spider-Verse Glitch Button | Web Tech Shorts</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="button-wrapper">

        <button class="spiderverse-button">

            <span class="button-text">
                CLICK ME
            </span>

            <!-- Glitch Layers -->
            <div class="glitch-layers">
                <div class="glitch-layer layer-1">
                    CLICK ME
                </div>

                <div class="glitch-layer layer-2">
                    CLICK ME
                </div>
            </div>

            <!-- Static Noise -->
            <div class="noise"></div>

            <!-- Glitch Slice -->
            <div class="glitch-slice"></div>

        </button>

    </div>

</body>

</html>
